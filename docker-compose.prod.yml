# Production stack for a single always-free Linux VM (Oracle Cloud Always Free, etc.).
#
#   cp .env.example .env    # fill in real values
#   docker compose --env-file .env -f docker-compose.prod.yml up -d --build
#
# Differences from docker-compose.yml (dev):
#   - MySQL / backend / frontend are NOT published to the host; only Caddy is.
#   - Caddy terminates HTTPS with automatic Let's Encrypt certificates.
#   - Everything restarts automatically after a reboot.
services:
  db:
    image: mysql:8.4
    container_name: shopsphere-db
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?set MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: shopsphere
      MYSQL_USER: ${MYSQL_USER:-shopsphere_user}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?set MYSQL_PASSWORD}
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci
    volumes:
      - db-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-p${MYSQL_ROOT_PASSWORD}"]
      interval: 10s
      timeout: 5s
      retries: 10

  backend:
    build: ./backend
    container_name: shopsphere-backend
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: docker
      SPRING_DATASOURCE_URL: jdbc:mysql://db:3306/shopsphere?useUnicode=true&characterEncoding=utf8&serverTimezone=UTC&useSSL=false&allowPublicKeyRetrieval=true
      SPRING_DATASOURCE_USERNAME: ${MYSQL_USER:-shopsphere_user}
      SPRING_DATASOURCE_PASSWORD: ${MYSQL_PASSWORD}
      JWT_SECRET_KEY: ${JWT_SECRET_KEY:?set JWT_SECRET_KEY}
      JWT_COOKIE_SECURE: "true"
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:?set CORS_ALLOWED_ORIGINS (https://your-domain)}
      RAZORPAY_ENABLED: ${RAZORPAY_ENABLED:-false}
      RAZORPAY_KEY_ID: ${RAZORPAY_KEY_ID:-}
      RAZORPAY_KEY_SECRET: ${RAZORPAY_KEY_SECRET:-}
      RAZORPAY_WEBHOOK_SECRET: ${RAZORPAY_WEBHOOK_SECRET:-}
      YOUPI_ENABLED: ${YOUPI_ENABLED:-false}
      # YouPI normally runs beside this stack (host process or private network).
      YOUPI_BASE_URL: ${YOUPI_BASE_URL:-http://host.docker.internal:6100}
      YOUPI_MERCHANT_ID: ${YOUPI_MERCHANT_ID:-}
      YOUPI_MERCHANT_KEY: ${YOUPI_MERCHANT_KEY:-}
      YOUPI_WEBHOOK_SECRET: ${YOUPI_WEBHOOK_SECRET:-}
      YOUPI_RETURN_BASE_URL: ${YOUPI_RETURN_BASE_URL:-}
    volumes:
      - uploads:/app/uploads
    extra_hosts:
      - "host.docker.internal:host-gateway"

  frontend:
    build: ./frontend
    container_name: shopsphere-frontend
    restart: unless-stopped
    depends_on:
      - backend

  caddy:
    image: caddy:2-alpine
    container_name: shopsphere-caddy
    restart: unless-stopped
    depends_on:
      - frontend
    ports:
      - "80:80"
      - "443:443"
    environment:
      PUBLIC_DOMAIN: ${PUBLIC_DOMAIN:?set PUBLIC_DOMAIN (e.g. shopsphere-demo.duckdns.org)}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config

volumes:
  db-data:
  uploads:
  caddy-data:
  caddy-config:
