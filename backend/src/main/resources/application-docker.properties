# `docker` profile — activated by docker-compose (SPRING_PROFILES_ACTIVE=docker).
# All credentials arrive as container environment variables; nothing is hardcoded.
spring.datasource.url=${SPRING_DATASOURCE_URL}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}

# Uploaded product images live on a named volume
UPLOAD_DIR=/app/uploads

# Plain HTTP inside the compose network (nginx terminates traffic)
JWT_COOKIE_SECURE=false

MAIL_CONSOLE_FALLBACK=true
MAIL_FROM=${MAIL_FROM:noreply@shopsphere.local}
